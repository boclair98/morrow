# Local dev for template-coders.
#
#   docker compose up
#
# Brings up:
#   db        — Postgres 16 on :5432
#   backend   — Kotlin + Spring Boot on :8000
#   frontend  — Next.js dev on :3000 (proxies /api/* to backend)
#
# Zero setup: `docker compose up` works on a fresh clone — no .env needed.
#
# Identity in dev: there is no platform gate locally, so DEV_FAKE_USER is set
# to a fixed UUID below and Spring Security treats requests as that signed-in
# user. Override it in backend/.env to test another identity, or unset it to
# exercise the anonymous path.
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Optional — `docker compose up` works zero-setup with the dev defaults
      # below. Create backend/.env (copy .env.example) only to override them.
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/app
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      REDIS_URL: redis://redis:6379
      # No platform gate locally → treat every request as this signed-in dev
      # user. Override in backend/.env if you want
      # to test as a different user, or unset to exercise the anonymous path.
      DEV_FAKE_USER: ${DEV_FAKE_USER:-00000000-0000-0000-0000-000000000001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      # Next.js rewrites this in next.config.ts at request time so it
      # picks up the in-compose hostname.
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
