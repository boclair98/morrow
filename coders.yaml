# coders.kr multi-service deploy manifest.
#
# MORROW owns its social OAuth session. The gate must not insert or trust a
# platform identity header in front of these routes.
#
# This file is validated against a STRICT schema: only the documented
# fields are allowed and any unknown key fails the deploy (see PLATFORM.md
# §9 for the full field list). Don't add fields the platform doesn't
# define — they won't be ignored, they'll be rejected.

version: "1"
mode: standalone

services:
  web:
    # Pre-rendered SPA served by nginx: `out/` from `next build` (with
    # `output: "export"` in next.config.ts) baked into an nginx:alpine
    # image. Static identical bytes for every visitor → CF caches the
    # HTML at the edge; identity + data are fetched client-side via
    # /api/* (nginx proxies those to the backend).
    dockerfile: frontend/Dockerfile
    context: frontend
    port: 80
    timeout: 3600
    expose: public
    env:
      BACKEND_URL: ${api.internal_url}

  api:
    dockerfile: backend/Dockerfile
    # `context` is the Docker build context — a Dockerfile can only COPY
    # files INSIDE it. `backend` is enough here. If a service needs a shared
    # monorepo package that lives outside its own dir (e.g. backend AND a
    # daemon both import `packages/protocol`), set `context: .` (repo root)
    # and have the Dockerfile COPY both `packages/protocol` and `backend/`.
    # A COPY of a path outside the context is the usual opaque build failure.
    context: backend
    port: 8000
    timeout: 3600
    env:
      DATABASE_URL: jdbc:postgresql://${db.host}:${db.port}/${db.name}
      DATABASE_USER: ${db.user}
      DATABASE_PASSWORD: ${db.password}
      AUTH_MODE: standalone
      PUBLIC_APP_URL: https://morrow.coders.kr
      REDIS_URL: ${cache.url}
      STORAGE_BUCKET: ${media.bucket}
      STORAGE_REGION: ${media.region}
      STORAGE_S3_ENDPOINT: ${media.s3_endpoint}
      STORAGE_ACCESS_KEY: ${media.access_key}
      STORAGE_SECRET_KEY: ${media.secret_key}
      STORAGE_PUBLIC_URL: ${media.public_url}
      # GCS's S3-compatible endpoint does not accept the SDK's optional
      # trailing checksum headers. Objects are still integrity-checked with
      # the SHA-256 digest persisted alongside every photo.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

  db:
    type: postgres
    size: 1Gi

  cache:
    type: redis

  media:
    type: object
    quota_gb: 5
